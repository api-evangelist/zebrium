name: Zebrium
description: 'Zebrium was an AIOps startup that used unsupervised machine learning to
  automatically detect anomalies and surface root cause from log data, correlating
  logs and metrics into plain-language incident summaries without manual rules or
  training. Backed by Accel, the company was acquired by ScienceLogic in 2022 and
  its technology folded into the ScienceLogic AIOps / SL1 platform (now surfaced as
  Skylar). The independent zebrium.com developer/API surface has been retired: the
  domain 301-redirects to sciencelogic.com and no standalone Zebrium API, documentation,
  or specification remains publicly discoverable. This profile is retained as a
  network lead recording the acquisition and the residual domain footprint.'
